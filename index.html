<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Godown Stock Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}header{background:#12344d;color:#fff;padding:18px 20px}h1{margin:0;font-size:22px}.bar{padding:14px 20px;background:#fff;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2;box-shadow:0 1px 5px #0002}button,input{padding:9px 12px;border:1px solid #ccd3da;border-radius:6px;background:#fff}button{cursor:pointer}button.active{background:#12344d;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:18px 20px}.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 1px 5px #0001}.num{font-size:25px;font-weight:bold;margin-top:5px}.wrap{padding:0 20px 25px;overflow:auto}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #d9dee3;padding:7px 9px;text-align:left;white-space:nowrap}th{background:#eaf0f4;position:sticky;top:59px;z-index:1}.due{background:#fff3cd}.empty{color:#777}.msg{padding:25px;text-align:center;color:#667}.small{font-size:12px;color:#6b7280}</style></head>
<body><header><h1>STATUS GODOWN NO. 9, 14, 18 AND 20</h1><div class="small">Live workbook viewer • Fumigation due = more than 30 days from LAST FUMIGATION</div></header>
<div class="bar"><button class="active" onclick="showView('dashboard',this)">Dashboard</button><button onclick="showView('fumigation',this)">Fumigation Due</button><button onclick="showView('undercover',this)">Under Cover</button><button onclick="showView('master',this)">Master Stock</button><button onclick="showView('qc',this)">QC Tracker</button><button onclick="showView('wheat',this)">Priority Wheat</button><button onclick="showView('rice',this)">Priority Rice</button><input id="search" placeholder="Search stack / shed / commodity" oninput="render()"></div>
<div id="app" class="wrap"><div class="msg">Loading workbook…</div></div>
<script>
let wb=null, rows={};
const file='des_total_DETAILS_FIXED_FINAL.xlsx';
function excelDate(v){if(v instanceof Date)return v;if(typeof v==='number'){let d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d):null}let d=new Date(v);return isNaN(d)?null:d}
function fmt(v){let d=excelDate(v);if(d)return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(-2);return v??''}
function load(){fetch(file).then(r=>{if(!r.ok)throw Error('Workbook not found');return r.arrayBuffer()}).then(b=>{wb=XLSX.read(b,{type:'array',cellDates:true});for(const s of wb.SheetNames){rows[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''})}render()}).catch(e=>document.getElementById('app').innerHTML='<div class="msg">Workbook not found. Upload <b>index.html</b> and <b>'+file+'</b> together in the same GitHub folder.</div>')}
let view='dashboard';
function showView(v,b){view=v;document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function master(){return rows['Master Stock']||[]}
function dataRows(){let a=master();return a.slice(1).filter(r=>r[3]||r[1]||r[4]||r[5]||r[6])}
function isOccupied(r){return String(r[7]).toUpperCase()==='OCCUPIED'||(r[3]&&r[7]==='')}
function due(r){let d=excelDate(r[11]);return isOccupied(r)&&d&&((new Date()-d)/86400000)>30}
function under(r){let d=excelDate(r[9]);return isOccupied(r)&&d&&!r[10]}
function searchFilter(r){let q=document.getElementById('search').value.toLowerCase().trim();return !q||r.some(v=>String(v).toLowerCase().includes(q))}
function table(headers, data){let h='<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';for(const r of data){h+='<tr>'+r.map((v,i)=>'<td>'+((v instanceof Date||i===1||i===9||i===10||i===11)?fmt(v):String(v??''))+'</td>').join('')+'</tr>'}return h+'</tbody></table>'}
function render(){if(!wb)return;let d=dataRows();let occ=d.filter(isOccupied), empty=d.filter(r=>String(r[7]).toUpperCase()==='EMPTY'), fd=d.filter(due), uc=d.filter(under);let app=document.getElementById('app');
if(view==='dashboard'){app.innerHTML=`<div class="cards"><div class="card">Total Stacks<div class="num">${d.length}</div></div><div class="card">Occupied<div class="num">${occ.length}</div></div><div class="card">Empty<div class="num">${empty.length}</div></div><div class="card">Fumigation Due<div class="num">${fd.length}</div></div><div class="card">Under Cover<div class="num">${uc.length}</div></div><div class="card">Wheat<div class="num">${occ.filter(r=>/wheat/i.test(r[6])).length}</div></div><div class="card">Rice<div class="num">${occ.filter(r=>/FRK|RRA/i.test(r[6])).length}</div></div></div><div class="card"><b>Fumigation Due Stacks</b><div class="wrap">${fd.length?table(['Shed','Stack','Last Fumigation','Days'],fd.map(r=>[r[2],r[3],fmt(r[11]),Math.floor((new Date()-excelDate(r[11]))/86400000)])):'<div class="msg">No fumigation due stacks</div>'}</div></div>`;return}
if(view==='fumigation'){let x=fd.filter(searchFilter);app.innerHTML='<h2>Fumigation Due</h2>'+ (x.length?table(['Sr No','Shed','Stack','Receipt Date','Commodity','Qty MT','Last Fumigation','Days'],x.map(r=>[r[0],r[2],r[3],fmt(r[1]),r[6],r[5],fmt(r[11]),Math.floor((new Date()-excelDate(r[11]))/86400000)])):'<div class="msg">No fumigation due stacks</div>');return}
if(view==='undercover'){let x=uc.filter(searchFilter);app.innerHTML='<h2>Under Cover</h2>'+ (x.length?table(['Sr No','Shed','Stack','Fumigation Date','Commodity','Qty MT'],x.map(r=>[r[0],r[2],r[3],fmt(r[9]),r[6],r[5]])):'<div class="msg">No under-cover stacks</div>');return}
let map={master:'Master Stock',qc:'QC Tracker',wheat:'Priority Wheat',rice:'Priority Rice'};let s=map[view];let a=rows[s]||[];let head=a[0]||[];let body=a.slice(1).filter(r=>r.some(v=>v!=='')&&searchFilter(r));app.innerHTML='<h2>'+s+'</h2>'+table(head,body)}
load();
</script></body></html>
